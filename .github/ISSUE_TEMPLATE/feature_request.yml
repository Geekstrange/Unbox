name: ✨ Feature Request
description: Suggest a new format, option, or improvement for Unbox.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! ✨

        - 🔎 Search [existing issues](https://github.com/Geekstrange/unbox/issues) first.
        - 🔒 Security issues are not feature requests — report them privately instead.

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What limitation are you hitting?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: New format, CLI flag, or behavior. Include example usage if possible.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - New archive format
        - New / changed CLI option
        - Extraction behavior
        - Nested / recursive handling
        - Performance
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I have searched existing issues and this is not a duplicate.
          required: true
        - label: I agree to follow this project's Code of Conduct.
          required: true
